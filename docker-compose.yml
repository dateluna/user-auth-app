version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: user-auth-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: user_auth
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  app:
    build: .
    container_name: user-auth-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root123456
      MYSQL_DATABASE: user_auth
      SESSION_SECRET: "your-session-secret-change-me"
    depends_on:
      - mysql

volumes:
  mysql_data:
