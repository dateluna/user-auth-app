<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册与登录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 注册表单（默认隐藏，点击"去注册"显示） -->
    <div class="form-box" id="registerBox" style="display: none;">
      <h2>用户注册</h2>
      <form id="registerForm">
        <div class="input-group">
          <label for="regUsername">用户名</label>
          <input type="text" id="regUsername" placeholder="请输入用户名（2-20个字符）" required>
        </div>
        <div class="input-group">
          <label for="regPassword">密码</label>
          <input type="password" id="regPassword" placeholder="请输入密码（至少6位）" required>
        </div>
        <div class="input-group">
          <label for="regConfirm">确认密码</label>
          <input type="password" id="regConfirm" placeholder="请再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
      </form>
      <p class="switch-text">
        已有账号？<a href="#" onclick="showLogin()">去登录</a>
      </p>
    </div>

    <!-- 登录表单 -->
    <div class="form-box" id="loginBox">
      <h2>用户登录</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="loginUsername">用户名</label>
          <input type="text" id="loginUsername" placeholder="请输入用户名" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-success">登录</button>
      </form>
      <p class="switch-text">
        还没有账号？<a href="#" onclick="showRegister()">点击这里注册</a>
      </p>
    </div>

    <!-- 登录成功页面 -->
    <div class="success-box" id="successBox" style="display: none;">
      <div class="success-icon">&#10003;</div>
      <h2 id="successMessage"></h2>
      <button class="btn btn-outline" onclick="handleLogout()">退出登录</button>
    </div>
  </div>

  <!-- 提示消息 -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
