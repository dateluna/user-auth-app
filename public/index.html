<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生日提醒系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ════ 登录/注册区域 ════ -->
  <div class="container" id="authSection">
    <!-- 注册 -->
    <div class="form-box" id="registerBox" style="display:none;">
      <h2>用户注册</h2>
      <form id="registerForm">
        <div class="input-group">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="2-20个字符" required>
        </div>
        <div class="input-group">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="至少6位" required>
        </div>
        <div class="input-group">
          <label>确认密码</label>
          <input type="password" id="regConfirm" placeholder="再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
      </form>
      <p class="switch-text">已有账号？<a href="#" onclick="showLogin()">去登录</a></p>
    </div>

    <!-- 登录 -->
    <div class="form-box" id="loginBox">
      <h2>用户登录</h2>
      <form id="loginForm">
        <div class="input-group">
          <label>用户名</label>
          <input type="text" id="loginUsername" placeholder="请输入用户名" required>
        </div>
        <div class="input-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-success">登录</button>
      </form>
      <p class="switch-text">还没有账号？<a href="#" onclick="showRegister()">点击这里注册</a></p>
    </div>
  </div>

  <!-- ════ 生日提醒系统面板 ════ -->
  <div id="dashboardSection" style="display:none;">
    <!-- 顶栏 -->
    <header class="dash-header">
      <h1>🎂 欢迎来到生日提醒系统</h1>
      <div class="dash-user">
        <span id="dashUsername"></span>
        <button class="btn btn-sm btn-outline" onclick="handleLogout()">退出登录</button>
      </div>
    </header>

    <main class="dash-main">
      <!-- 添加/编辑表单 -->
      <section class="card form-card">
        <h2 id="formTitle">+ 添加生日提醒</h2>
        <form id="birthdayForm">
          <div class="form-row">
            <div class="form-group">
              <label>姓名</label>
              <input type="text" id="bName" placeholder="请输入姓名" required>
            </div>
            <div class="form-group">
              <label>关系</label>
              <select id="bRelation">
                <option value="家人">家人</option>
                <option value="朋友">朋友</option>
                <option value="同事">同事</option>
                <option value="同学">同学</option>
                <option value="伴侣">伴侣</option>
                <option value="其他">其他</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group calendar-type-group">
              <label>日历类型</label>
              <div class="radio-group">
                <label class="radio-label"><input type="radio" name="calendarType" value="solar" checked> 公历</label>
                <label class="radio-label"><input type="radio" name="calendarType" value="lunar"> 农历</label>
              </div>
            </div>
          </div>

          <!-- 公历生日输入 -->
          <div class="form-row" id="solarInput">
            <div class="form-group">
              <label>生日日期</label>
              <input type="date" id="bDate">
            </div>
          </div>

          <!-- 农历生日输入 -->
          <div class="form-row" id="lunarInput" style="display:none;">
            <div class="form-group">
              <label>农历月份</label>
              <select id="bLunarMonth">
                <option value="1">正月</option><option value="2">二月</option><option value="3">三月</option>
                <option value="4">四月</option><option value="5">五月</option><option value="6">六月</option>
                <option value="7">七月</option><option value="8">八月</option><option value="9">九月</option>
                <option value="10">十月</option><option value="11">冬月</option><option value="12">腊月</option>
              </select>
            </div>
            <div class="form-group">
              <label>农历日期</label>
              <select id="bLunarDay">
                <!-- JS 动态生成 1-30 -->
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
            <button type="button" class="btn btn-cancel" id="cancelBtn" style="display:none;" onclick="cancelEdit()">取消</button>
          </div>
        </form>
      </section>

      <!-- 生日列表 -->
      <section class="card list-card">
        <h2>📋 生日列表</h2>
        <div id="birthdayList">
          <div class="empty-state">暂无生日提醒，请在左侧添加</div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
